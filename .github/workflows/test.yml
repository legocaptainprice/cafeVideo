name: cafeVideo Application Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set test secret key
        run: echo "SECRET_CAFE_KEY=test-only-key-for-github-actions" >> "$GITHUB_ENV"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run application integration tests
        run: python -m pytest -v .github/workflows/github_actions.py
