name: cafeVideo Deployment Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set test secret key
        run: echo "SECRET_CAFE_KEY=test-only-key-for-github-actions" >> "$GITHUB_ENV"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run automated tests
        run: pytest -vv -s .github/workflows/github_actions.py

      - name: Package tested commit
        if: success()
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          git archive --format=zip --output="cafeVideo-${DATE}.zip" HEAD
          echo "ARTIFACT_NAME=cafeVideo-${DATE}.zip" >> "$GITHUB_ENV"

      - name: Upload tested commit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cafeVideo-${{ github.run_id }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
