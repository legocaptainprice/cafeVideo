name: cafeVideo Deployment Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set test secret key
        run: echo "SECRET_CAFE_KEY=test-only-key-for-github-actions" >> "$GITHUB_ENV"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run automated tests
        run: pytest -vv -s .github/workflows/github_actions.py

      - name: Package tested commit
        if: success()
        run: |
          MAJOR=$(python -c "import manifest; print(manifest.MAJOR)")
          MINOR=$(python -c "import manifest; print(manifest.MINOR)")
          PATCH=$(python -c "import manifest; print(manifest.PATCH)")
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          CHANNEL=$(python -c "import manifest; print(manifest.channel)")
          BUILD_NUMBER=$(git rev-list --count HEAD)

          ARTIFACT_NAME="cafeVideo-${VERSION}.build${BUILD_NUMBER}.${CHANNEL}"

          git archive --format=zip --output="${ARTIFACT_NAME}.zip" HEAD

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}.zip" >> "$GITHUB_ENV"
          echo "Build: ${ARTIFACT_NAME}"

      - name: Upload tested commit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
