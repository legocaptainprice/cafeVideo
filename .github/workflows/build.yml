name: cafeVideo Main Builds

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set test secret key
        run: echo "SECRET_CAFE_KEY=test-only-key-for-github-actions" >> "$GITHUB_ENV"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run application integration tests
        run: python -m pytest -v .github/workflows/github_actions.py

      - name: Calculate build version
        if: success()
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import subprocess
          import manifest

          build_number = int(subprocess.check_output(
              ["git", "rev-list", "--count", "HEAD"], text=True
          ).strip())
          channel = manifest.CHANNEL
          print(f"build_number={build_number}")
          print(f"channel={channel}")
          print(f"full_version={manifest.full_version(build_number, channel)}")
          print(f"display_version={manifest.display_version(build_number, channel)}")
          print(f"release_tag={manifest.release_tag(build_number, channel)}")
          PY

    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      channel: ${{ steps.version.outputs.channel }}
      full_version: ${{ steps.version.outputs.full_version }}
      display_version: ${{ steps.version.outputs.display_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

  database-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            image: mysql:8.4
            connection: mysql+pymysql://root:cafe_test_password@127.0.0.1:3306/cafevideo?charset=utf8mb4
            health_options: --health-cmd="mysqladmin ping --silent -h localhost -pcafe_test_password" --health-interval=10s --health-timeout=5s --health-retries=10
          - engine: postgresql
            image: postgres:16
            connection: postgresql+psycopg://postgres:cafe_test_password@127.0.0.1:5432/cafevideo
            health_options: --health-cmd="pg_isready -U postgres -d cafevideo" --health-interval=10s --health-timeout=5s --health-retries=10
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: cafe_test_password
          MYSQL_DATABASE: cafevideo
          POSTGRES_PASSWORD: cafe_test_password
          POSTGRES_DB: cafevideo
        ports:
          - 3306:3306
          - 5432:5432
        options: ${{ matrix.health_options }}
    env:
      CAFE_TEST_DATABASE_URL: ${{ matrix.connection }}
      SECRET_CAFE_KEY: test-only-key-for-github-actions
    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application and database drivers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest PyMySQL "psycopg[binary]"

      - name: Run application integration tests on ${{ matrix.engine }}
        run: python -m pytest -v .github/workflows/github_actions.py

  artifact:
    needs: [test, database-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Package tested commit with build metadata
        env:
          BUILD_NUMBER: ${{ needs.test.outputs.build_number }}
          FULL_VERSION: ${{ needs.test.outputs.full_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/cafeVideo"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/cafeVideo"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest_path = Path(os.environ["RUNNER_TEMP"]) / "cafeVideo" / "manifest.py"
          manifest = manifest_path.read_text()
          manifest, replacements = re.subn(
              r"^BUILD_NUMBER = int\(os\.environ\.get\(\"CAFE_BUILD_NUMBER\", \"0\"\)\)$",
              f"BUILD_NUMBER = {int(os.environ['BUILD_NUMBER'])}",
              manifest,
              flags=re.MULTILINE,
          )
          if replacements != 1:
              raise SystemExit("Could not embed the build number in manifest.py")
          manifest_path.write_text(manifest)
          PY
          cd "$RUNNER_TEMP/cafeVideo"
          zip -qr "$GITHUB_WORKSPACE/cafeVideo-${FULL_VERSION}.zip" .

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafeVideo-${{ needs.test.outputs.full_version }}
          path: cafeVideo-${{ needs.test.outputs.full_version }}.zip
          if-no-files-found: error

  release:
    needs: [test, artifact]
    if: contains(fromJSON('["beta", "rc", "release"]'), needs.test.outputs.channel)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download versioned artifact
        uses: actions/download-artifact@v4
        with:
          name: cafeVideo-${{ needs.test.outputs.full_version }}

      - name: Publish channel release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.test.outputs.channel }}
          DISPLAY_VERSION: ${{ needs.test.outputs.display_version }}
          RELEASE_TAG: ${{ needs.test.outputs.release_tag }}
          FULL_VERSION: ${{ needs.test.outputs.full_version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "cafeVideo-${FULL_VERSION}.zip" --clobber
          elif [[ "$CHANNEL" == "beta" || "$CHANNEL" == "rc" ]]; then
            gh release create "$RELEASE_TAG" "cafeVideo-${FULL_VERSION}.zip" \
              --title "$DISPLAY_VERSION" \
              --notes "Automated $CHANNEL build $FULL_VERSION." \
              --target "$GITHUB_SHA" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "cafeVideo-${FULL_VERSION}.zip" \
              --title "$DISPLAY_VERSION" \
              --notes "Automated release build $FULL_VERSION." \
              --target "$GITHUB_SHA"
          fi
